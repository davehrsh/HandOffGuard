name: HandoffGuard Java 21 CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run all regression suites
        run: sh scripts/test.sh
      - name: Validate deployment script and viewer JavaScript
        run: |
          bash -n scripts/setup-monitoring-gcp.sh
          bash -n scripts/enable-public-evidence.sh
          node --check web/history.js
          node --check web/app.js
      - name: Validate Docker image builds
        run: docker build -t handoffguard:ci .
