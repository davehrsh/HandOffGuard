name: HandoffGuard Java 21 CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run all regression suites
        run: sh scripts/test.sh
      - name: Validate Docker image builds
        run: docker build -t handoffguard:ci .
